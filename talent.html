<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Talent Board · North America</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--card:#13131a;--border:#2a2a3a;--purple:#6366f1;--gold:#f4c430;--text:#e0e0e0;--muted:#6b7280;--green:#10b981;--blue:#3b82f6;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
    
    nav{background:#0d0d14;border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50;}
    .nav-logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#fff;text-decoration:none;}
    .nav-links{display:flex;gap:4px;}
    .nav-link{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s;text-decoration:none;}
    .nav-link:hover{background:#1e1e2e;color:#fff;}
    
    .container { flex:1; max-width: 900px; margin: 40px auto; width: 100%; padding: 0 20px; display:flex; gap:32px;}
    
    .main-col { flex: 2; }
    .side-col { flex: 1; }

    .header-block { margin-bottom: 32px; }
    .header-block h1 { font-size: 28px; margin-bottom: 8px; color:#fff;}
    .header-block p { color: var(--muted); font-size: 15px; line-height: 1.5; }

    .job-card { background: #050505; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: border 0.2s;}
    .job-card:hover { border-color: var(--purple); }
    .job-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 8px;}
    .job-meta { display:flex; gap:12px; font-size: 12px; color: var(--muted); margin-bottom: 12px;}
    .meta-badge { background: #13131a; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; display:flex; align-items:center; gap:4px; }
    .job-desc { font-size: 14px; color: #a1a1aa; line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .btn-apply { background: var(--purple); color: #fff; padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; text-decoration:none;}

    .post-form { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; position:sticky; top: 80px;}
    .post-form h3 { font-size: 16px; margin-bottom: 16px; color:#fff;}
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600;}
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; background: #050505; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; outline:none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--purple); }
    .btn-submit { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.9; }
    
    .badge-na { color: var(--blue); border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.1); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo"><span class="logo-icon">🌾</span> Wheat Community</a>
    <div class="nav-links">
      <a href="/launch" class="nav-link">Launch</a>
      <a href="/talent" class="nav-link" style="color:var(--gold)">Talent Board</a>
    </div>
  </nav>

  <div class="container">
    <div class="main-col">
      <div class="header-block">
        <h1>North America Talent Board</h1>
        <p>Connecting elite Industrial Automation Engineers and Technical Contractors across the US & Canada. Post your project needs or find high-paying contracts.</p>
      </div>

      <div id="jobsList">
        <div style="color:var(--muted); font-size:14px; text-align:center; padding:40px;">Loading open positions...</div>
      </div>
    </div>

    <div class="side-col">
      <form class="post-form" id="postForm">
        <h3>Post a Project / Need</h3>
        <div class="form-group">
          <label>Project Title</label>
          <input type="text" id="jTitle" placeholder="e.g. PLC Programmer for Assembly Line" required />
        </div>
        <div class="form-group">
          <label>Role / Skill Required</label>
          <input type="text" id="jRole" placeholder="e.g. Siemens PLC, SCADA" required />
        </div>
        <div class="form-group">
          <label>Region Focus</label>
          <select id="jRegion" disabled style="opacity:0.8; cursor:not-allowed;">
            <option value="North America (US/CA)" selected>North America (US/CA)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Budget Range</label>
          <input type="text" id="jBudget" placeholder="e.g. $5,000 - $10,000 or $80/hr" required />
        </div>
        <div class="form-group">
          <label>Contact Email</label>
          <input type="email" id="jContact" placeholder="Your work email" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="jDesc" rows="4" placeholder="Briefly describe the project scope and timeline..." required></textarea>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Post Demand</button>
      </form>
    </div>
  </div>

  <script>
    async function loadDemands() {
      const list = document.getElementById('jobsList');
      try {
        const res = await fetch('/api/talent/demands');
        const data = await res.json();
        if(data.status==='ok' && data.data.length>0) {
          list.innerHTML = data.data.map(d => `
            <div class="job-card">
              <div class="job-title">${d.title}</div>
              <div class="job-meta">
                <span class="meta-badge">🛠️ ${d.role}</span>
                <span class="meta-badge badge-na">🌎 ${d.region}</span>
                <span class="meta-badge" style="color:var(--green); border-color:var(--green);">💰 ${d.budget}</span>
              </div>
              <div class="job-desc">${d.description}</div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; color:var(--muted)">Posted: ${new Date(d.receivedAt).toLocaleDateString()}</span>
                <a href="mailto:${d.contact}?subject=Application for: ${encodeURIComponent(d.title)}" class="btn-apply">Contact Employer</a>
              </div>
            </div>
          `).join('');
        } else {
          list.innerHTML = `<div style="color:var(--muted); font-size:14px; text-align:center; padding:40px;">No open positions at the moment.</div>`;
        }
      } catch(e) {
        list.innerHTML = `<div style="color:var(--muted); font-size:14px;">Error loading demands.</div>`;
      }
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Posting...'; btn.disabled = true;

      const payload = {
        title: document.getElementById('jTitle').value,
        role: document.getElementById('jRole').value,
        region: document.getElementById('jRegion').value,
        budget: document.getElementById('jBudget').value,
        contact: document.getElementById('jContact').value,
        description: document.getElementById('jDesc').value
      };

      try {
        const res = await fetch('/api/talent/submit', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if(res.ok) {
          alert('Demand posted successfully!');
          document.getElementById('postForm').reset();
          loadDemands();
        } else {
          alert('Error posting demand.');
        }
      } catch(e) { alert('Network error.'); }
      
      btn.textContent = 'Post Demand'; btn.disabled = false;
    });

    // Initial load
    loadDemands();
  </script>
</body>
</html>
